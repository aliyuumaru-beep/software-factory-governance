name: enforcement-tests
on:
  pull_request:
    paths: ['enforcement/**', '.github/workflows/governance-gate.yml']
  push:
    branches: [main]
    paths: ['enforcement/**']
permissions:
  contents: read
jobs:
  gateway-acceptance:
    name: Gateway acceptance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git config --global init.defaultBranch main
      - run: python3 enforcement/tests/test_gov.py
